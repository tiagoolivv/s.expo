# 🔗 Links:
# Source file: https://github.com/obytes/react-native-template-obytes/blob/master/.github/workflows/expo-doctor.yml

# ✍️ Description:
# This workflow runs the expo doctor command to check if your project dependencies are aligned with the expo sdk version you are using.
# Can be triggered manually from the Actions tab in your project.
# Runs Also on pull requests and pushes to the main/master branch, but only if the `package.json` or `pnpm-lock.yaml` files have been changed.

# 🚨 GITHUB SECRETS REQUIRED: NONE

name: Expo Doctor (expo)

on:
  push:
    branches:
      - main
      - master
    paths:
      - package.json
      - pnpm-lock.yaml
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read
  pull-requests: write

jobs:
  doctor:
    name: Expo Doctor (expo)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Run prebuild
        # Retried like the other two prebuild call sites (.github/actions/eas-build,
        # setup-jdk-generate-apk): app-icon-badge reads back an icon it is still
        # writing, and about one Linux run in four fails with
        # "Could not find MIME for Buffer <null>".
        run: |
          for attempt in 1 2 3; do
            echo "prebuild attempt $attempt"
            pnpm run prebuild && break
            if [ "$attempt" = "3" ]; then
              echo "prebuild failed three times - this is not the known flake"
              exit 1
            fi
            rm -rf ios android
          done

      - name: 🚑 Run Doctor Checks
        run: |
          chmod +x .github/scripts/expo-doctor.sh
          rm -rf ios android
          .github/scripts/expo-doctor.sh

      - name: Add doctor report as comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: expo-doctor
          path: .expo/expo-doctor.md
